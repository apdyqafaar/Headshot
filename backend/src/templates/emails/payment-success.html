<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Payment successful</title>
    <style>
       
        body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:0;}
        .wrapper{max-width:600px;margin:0 auto;background:#fff;padding:20px;}
        .btn{display:inline-block;padding:10px 20px;color:#fff;background:#007bff;text-decoration:none;border-radius:4px;}
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Payment Successful</h1>
        <p>Hi {{name}},</p>
        <p>Your order <strong>#{{orderId}}</strong> has completed successfully.</p>
        <p>Amount charged: ${{amoun}}</p>
        <p>Your new balance is <strong>${{newBalance}}</strong>.</p>
        <p><a href="{{dashboardUrl}}" class="btn">Go to your dashboard</a></p>
        <p>Thanks,<br/>the team</p>
    </div>
</body>
</html>
