<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headshot Generator Update</title>
    <style>
        /* Modern client overrides */
        body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        .content-body p { margin-bottom: 15px; }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f9fafb; font-family: 'Segoe UI', Helvetica, Arial, sans-serif;">

    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f9fafb; padding: 40px 10px;">
        <tr>
            <td align="center">
                
                <table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;">
                    
                    <tr>
                        <td style="padding: 30px 40px; background-color: #ffffff; border-bottom: 1px solid #f3f4f6;">
                            <div style="font-size: 18px; font-weight: 700; color: #111827; letter-spacing: -0.5px;">
                                Headshot <span style="color: #4f46e5;">Generator</span>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td class="content-body" style="padding: 40px; font-size: 16px; line-height: 1.6; color: #374151;">
                            {{content}}
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 0 40px 40px 40px; font-size: 14px; line-height: 1.5; color: #6b7280;">
                            <p style="margin: 0; font-weight: 600; color: #111827;">Best regards,</p>
                            <p style="margin: 0;">The Headshot Generator Team</p>
                            
                            <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 30px 0;">
                            
                            <p style="font-size: 12px; color: #9ca3af; text-align: center; margin: 0;">
                                This is an automated email, please do not reply.
                            </p>
                        </td>
                    </tr>

                </table>

                <table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px;">
                    <tr>
                        <td style="padding-top: 20px; font-size: 12px; color: #9ca3af; text-align: center;">
                            &copy; 2026 Headshot Generator Inc. All rights reserved.
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
